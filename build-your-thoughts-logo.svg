<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Build Your Thoughts</title>
  <desc id="desc">Build Your Thoughts app and web development company logo</desc>

  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CDFB47"/>
      <stop offset="100%" stop-color="#A9E51F"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(55 40)">
    <!-- abstract B -->
    <path d="M72 0h102c61 0 101 31 101 79 0 31-17 54-45 66 39 11 61 38 61 76 0 57-46 99-112 99H72V0Zm66 55v80h33c25 0 40-14 40-39 0-26-16-41-42-41h-31Zm0 132v78h41c29 0 47-14 47-39 0-25-18-39-48-39h-40Z" fill="#0F1412"/>

    <!-- growth / forward ribbon -->
    <path d="M15 79 91 5v58L44 109l72 72-43 43-72-72c-20-20-20-53 0-73l14-14Z" fill="url(#lime)"/>
    <path d="M83 206 177 112h-42l69-69 69 69h-43l-98 98-49-4Z" fill="url(#lime)"/>

    <!-- small digital pixels -->
    <rect x="9" y="39" width="14" height="14" rx="3" fill="#CDFB47"/>
    <rect x="28" y="20" width="9" height="9" rx="2" fill="#0F1412"/>
    <rect x="0" y="61" width="8" height="8" rx="2" fill="#A9E51F"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(390 108)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="74" font-weight="800" letter-spacing="-2.5" fill="#0F1412">Build Your</text>
    <text x="0" y="84" font-family="Inter, Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-3" fill="#5C7A0F">Thoughts</text>

    <!-- descriptor -->
    <line x1="2" y1="124" x2="70" y2="124" stroke="#A9E51F" stroke-width="5" stroke-linecap="round"/>
    <text x="88" y="132" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="5" fill="#3A423F">APP &amp; WEB DEVELOPMENT</text>
  </g>

  <!-- subtle registered mark -->
  <text x="1055" y="126" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1412">™</text>
</svg>