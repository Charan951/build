<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Build Your Thoughts</title>
  <desc id="desc">Build Your Thoughts logo with a geometric B, forward arrow and growth motif.</desc>
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CDFB47"/>
      <stop offset="100%" stop-color="#9DD516"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18211D"/>
      <stop offset="100%" stop-color="#0F1412"/>
    </linearGradient>
  </defs>

  <!-- ICON -->
  <g transform="translate(60 42)">
    <!-- geometric B -->
    <path fill="url(#dark)" d="M70 0H244C315 0 361 40 361 101C361 141 340 171 308 190C347 207 369 240 369 286C369 349 320 388 246 388H70V0ZM145 61V161H218C253 161 274 143 274 113C274 80 253 61 217 61H145ZM145 226V327H232C269 327 291 308 291 278C291 246 269 226 231 226H145Z"/>

    <!-- forward arrow -->
    <path fill="url(#lime)" d="M42 86L136 4V72L91 112L198 219L143 274L34 166C14 146 17 108 42 86Z"/>

    <!-- growth arrow -->
    <path fill="url(#lime)" d="M117 353L269 201H220L345 77V164H397V224H345V309L220 184L174 230L220 276L162 334Z"/>

    <!-- digital pixels -->
    <rect x="5" y="57" width="15" height="15" rx="3" fill="#CDFB47"/>
    <rect x="28" y="35" width="10" height="10" rx="2" fill="#0F1412"/>
    <rect x="0" y="81" width="8" height="8" rx="2" fill="#A9E51F"/>
  </g>

  <!-- DIVIDER -->
  <line x1="500" y1="58" x2="500" y2="372" stroke="#B8BFBB" stroke-width="2"/>

  <!-- WORDMARK -->
  <g transform="translate(555 48)">
    <text x="0" y="105" font-family="Inter,Arial,Helvetica,sans-serif"
          font-size="104" font-weight="800" letter-spacing="-4" fill="#0F1412">Build</text>
    <text x="0" y="210" font-family="Inter,Arial,Helvetica,sans-serif"
          font-size="104" font-weight="800" letter-spacing="-4" fill="#0F1412">Your</text>
    <text x="250" y="210" font-family="Inter,Arial,Helvetica,sans-serif"
          font-size="104" font-weight="800" letter-spacing="-4" fill="#5C7A0F">Thoughts</text>

    <text x="890" y="126" font-family="Arial,sans-serif" font-size="21"
          font-weight="700" fill="#0F1412">®</text>

    <!-- tagline -->
    <g transform="translate(8 270)">
      <line x1="0" y1="0" x2="65" y2="0" stroke="#A9E51F" stroke-width="5" stroke-linecap="round"/>
      <text x="91" y="8" font-family="Inter,Arial,sans-serif" font-size="25"
            font-weight="600" letter-spacing="8" fill="#3A423F">IDEAS</text>
      <circle cx="210" cy="0" r="6" fill="#A9E51F"/>
      <text x="243" y="8" font-family="Inter,Arial,sans-serif" font-size="25"
            font-weight="600" letter-spacing="8" fill="#3A423F">CODE</text>
      <circle cx="387" cy="0" r="6" fill="#A9E51F"/>
      <text x="420" y="8" font-family="Inter,Arial,sans-serif" font-size="25"
            font-weight="600" letter-spacing="8" fill="#3A423F">IMPACT</text>
      <line x1="594" y1="0" x2="660" y2="0" stroke="#A9E51F" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
